# ═══════════════════════════════════════════════════════════
# PLAYBACK
# ═══════════════════════════════════════════════════════════
#save-position-on-quit=yes
keep-open=yes

# ═══════════════════════════════════════════════════════════
# SUBTITLES
# ═══════════════════════════════════════════════════════════
alang=en,eng
slang=en,eng
subs-with-matching-audio=forced
subs-fallback=yes
sub-auto=fuzzy
sub-font-size=42

# ═══════════════════════════════════════════════════════════
# GPU / VIDEO RENDERING (NVIDIA + Vulkan)
# ═══════════════════════════════════════════════════════════
gpu-api=vulkan
hwdec=nvdec
vo=gpu-next
profile=gpu-hq

# High-quality scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# --- HDR handling ---
# When the compositor runs the display in HDR mode (Hyprland `cm, hdr`),
# this hint makes mpv pass HDR10/DV through untouched so the TV does its own
# tone mapping — the definitive rendition. When the display is in SDR mode,
# the hint is inert and the tone-mapping settings below apply instead.
target-colorspace-hint=yes

# HDR → SDR fallback: the default curve (spline) preserves the grade's
# intent but reads dark on dim-graded films. bt.2446a is the ITU curve
# designed for HDR→SDR broadcast conversion — noticeably brighter overall.
# Contrast recovery restores shadow/highlight detail lost in the curve.
tone-mapping=bt.2446a
hdr-contrast-recovery=0.30

# ═══════════════════════════════════════════════════════════
# OSD & WINDOW
# ═══════════════════════════════════════════════════════════
osc=yes
osd-bar=yes
osd-level=1
osd-duration=2500
autofit-larger=90%x90%
cursor-autohide=1000
input-ar-delay=1000

# ═══════════════════════════════════════════════════════════
# AUDIO
# ═══════════════════════════════════════════════════════════
volume=100
volume-max=150

# --- Dynamic range / loudness (output is stereo) ---
# Apply the AC3/E-AC3 "night mode" dynamic-range curve that the film's own
# sound mixers authored. This is the most intent-preserving way to tame the
# quiet-dialogue / loud-action swing, because the compression curve ships in
# the stream rather than being guessed at. 0.0 = full theatrical range,
# 1.0 = full authored DRC. No effect on tracks without DRC metadata (DTS,
# PCM, FLAC). Dial to 0.5 for a compromise between theatrical and night.
ad-lavc-ac3drc=1.0

# Force the stereo downmix to match the usual stereo output, so playback is
# deterministic regardless of the source's channel layout. Comment out if a
# real 5.1/7.1 system is ever connected.
audio-channels=stereo

# Adaptive loudness leveling (dynaudnorm) is intentionally NOT on by default
# — it's bound to a toggle key ("n", see input.conf) so it stays opt-in for
# the films that need more than the authored DRC.

# ═══════════════════════════════════════════════════════════
# SCREENSHOTS
# ═══════════════════════════════════════════════════════════
screenshot-directory=~/pictures/
screenshot-format=png
